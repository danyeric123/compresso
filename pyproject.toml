[project]
name = "compresso"
version = "0.1.0"
description = "Convert files between formats and fit them under a target size."
readme = "README.md"
authors = [
    { name = "danyeric123", email = "dnagarpowers@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.3.3",
    "img2pdf>=0.6.3",
    "pillow>=12.2.0",
    "pillow-heif>=1.3.0",
    "pypdfium2>=5.7.1",
    "rich>=15.0.0",
    "tqdm>=4.67.3",
]

[project.scripts]
compresso = "compresso.cli:cli"

[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
    "types-tqdm>=4.67.3.20260408",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["img2pdf", "pillow_heif", "pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
